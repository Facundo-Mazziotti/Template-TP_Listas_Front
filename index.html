<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comidas Argentinas</title> 
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <header class="filtros">
      
      <input type="search" id="buscador" placeholder="Buscar por nombre, provincia o categoria">

      <select id="filtroCategoria">
        <option value="">Todas las categorias</option>
        <option value="Parrilla">Parrilla</option>
        <option value="Horno">Horno</option>
        <option value="Guiso">Guiso</option>
        <option value="Frito">Frito</option>
      </select>

      <select id="filtroProvincia">
        <option value="">Todas las provincias</option>
        <option value="Buenos Aires">Buenos Aires</option>
        <option value="Cordoba">Cordoba</option>
        <option value="Entre Rios">Entre Ríos</option>
        <option value="Jujuy">Jujuy</option>
        <option value="Salta">Salta</option>
        <option value="Santa Fe">Santa Fe</option>
        <option value="Tucuman">Tucumán</option>
      </select>
   
    </header>
    <section class="comidas">
    <main class="comida-container" id="comidaContainer">
        <!-- Contenido Dinamico -->
    </main>     
  </section>

    <section class="addFood">
      <form id="agregarComida">
        <label for="nombre">Nombre de la comida</label>
        <input type="text" placeholder="Nombre de la comida" id="nombre" required>
        <p></p>

        <label for="categoria">Categoria de la comida</label>
        <input type="text" placeholder="Categoria de la comida" id="categoria" required>
        <p></p>
        
        <label for="provincia">Provincia de la comida</label>
        <input type="text" placeholder="Provincia de la comida" id="provincia" required>
        <p></p>

        <label for="ingredientes">Ingredientes de la comida</label>
        <input type="text" placeholder="Ingredientes de la comida" id="ingredientes" required>
        <p></p>
       
        <button type="submit">Agregar comida</button>

      </form>
    </section>

    <script type="module" src="./main.js"></script>
</body>
</html>
