<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comidas Argentinas</title> 
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <header class="filtros">
      
      <input type="search" id="buscador" placeholder="Buscar por nombre, provincia o categoria">

      <select id="filtroCategoria">
        <option value="">Todas las categorias</option>
        
      </select>

      <select id="filtroProvincia">
        <option value="">Todas las provincias</option>
       
      </select>
   
    </header>
    <section class="comidas">
    <main class="comida-container" id="comidaContainer">
        <!-- Contenido Dinamico -->
    </main>     
  </section>

    <section class="addFood">
      <form id="agregarComida">
        <label for="nombre">Nombre de la comida</label>
        <input type="text" placeholder="Nombre de la comida" id="nombre" required>
        <p></p>

        <label for="categoria">Categoria de la comida</label>
        <input type="text" placeholder="Categoria de la comida" id="categoria" required>
        <p></p>
        
        <label for="provincia">Provincia de la comida</label>
        <input type="text" placeholder="Provincia de la comida" id="provincia" required>
        <p></p>

        <label for="ingredientes">Ingredientes</label>
        <div class="contenedor-ingredientes">
        <input type="text" class="ingrediente" placeholder="Ingrediente" id="ingredientes" required>
      </div>
        <button type="button" id="agregarIngrediente">Agregar ingrediente</button>
      
        <button type="submit">Agregar comida</button>

      </form>
    </section>

    <script type="module" src="./main.js"></script>
</body>
</html>
